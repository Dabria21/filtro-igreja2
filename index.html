<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Filtro</title>
<style>
  :root { --branco:#fff; --fundo:#000; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--fundo); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--branco); }

  /* Palco 9:16, centralizado, igual à câmera do Instagram */
  #palco { position:relative; margin:0 auto; height:100dvh;
    width:min(100vw, calc(100dvh * 9 / 16)); aspect-ratio:9/16; overflow:hidden; background:#111; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #video.espelhar { transform:scaleX(-1); }
  #moldura { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none; }

  .barra { position:absolute; left:0; right:0; display:flex; align-items:center; justify-content:center; }
  #baixo { bottom:calc(24px + env(safe-area-inset-bottom, 0px)); }
  #cima  { top:calc(16px + env(safe-area-inset-top, 0px)); justify-content:space-between; padding:0 16px; }

  #disparo { width:78px; height:78px; border-radius:50%; border:5px solid var(--branco);
    background:rgba(255,255,255,.25); padding:0; cursor:pointer; transition:transform .12s; }
  #disparo:active { transform:scale(.9); }
  #disparo:focus-visible, #virar:focus-visible { outline:3px solid #4da3ff; outline-offset:3px; }

  #virar { width:46px; height:46px; border-radius:50%; border:0; background:rgba(0,0,0,.4);
    color:var(--branco); font-size:22px; cursor:pointer; }
  #contador { min-width:46px; padding:8px 12px; border-radius:23px; background:rgba(0,0,0,.4);
    font-size:15px; font-variant-numeric:tabular-nums; text-align:center; visibility:hidden; }
  #contador.ativo { visibility:visible; }

  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #flash.pisca { animation:pisca .25s ease-out; }
  @keyframes pisca { from { opacity:.85; } to { opacity:0; } }
  @media (prefers-reduced-motion:reduce) { #flash.pisca { animation:none; } }

  #aviso { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; padding:32px; text-align:center; background:rgba(0,0,0,.85); font-size:17px; line-height:1.4; }
  #aviso.ativo { display:flex; }
  #aviso button { padding:12px 22px; border-radius:24px; border:0; font-size:16px; background:var(--branco); color:#000; cursor:pointer; }

  #toast { position:absolute; left:50%; bottom:calc(120px + env(safe-area-inset-bottom, 0px));
    transform:translateX(-50%); padding:8px 14px; border-radius:18px; background:rgba(0,0,0,.65);
    font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  #toast.ativo { opacity:1; }
</style>
</head>
<body>
<div id="palco">
  <video id="video" autoplay playsinline muted></video>
  <img id="moldura" src="assets/overlay.png" alt="">
  <div id="flash"></div>

  <div id="cima" class="barra">
    <span id="contador">0</span>
  </div>
  <div id="baixo" class="barra">
    <button id="disparo" type="button" aria-label="Tirar foto"></button>
  </div>

  <div id="toast"></div>
  <div id="aviso">
    <p id="avisoTexto"></p>
    <button id="tentar" type="button">Permitir câmera</button>
  </div>
</div>

<script>
(function () {
  var video = document.getElementById('video');
  var moldura = document.getElementById('moldura');
  var disparo = document.getElementById('disparo');
  var flash = document.getElementById('flash');
  var contadorEl = document.getElementById('contador');
  var toast = document.getElementById('toast');
  var aviso = document.getElementById('aviso');
  var avisoTexto = document.getElementById('avisoTexto');
  var tentar = document.getElementById('tentar');

  var facing = 'user', stream = null, fotos = 0, ocupado = false;

  function lerN() { try { return parseInt(localStorage.getItem('filtro_n'), 10) || 0; } catch (e) { return 0; } }
  function gravarN(n) { try { localStorage.setItem('filtro_n', String(n)); } catch (e) {} }
  var n = lerN();

  function mostrarToast(t) {
    toast.textContent = t; toast.classList.add('ativo');
    setTimeout(function () { toast.classList.remove('ativo'); }, 1800);
  }
  function mostrarAviso(t, botao) {
    avisoTexto.textContent = t; tentar.style.display = botao ? '' : 'none'; aviso.classList.add('ativo');
  }

  async function iniciar() {
    aviso.classList.remove('ativo');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      mostrarAviso('Este navegador não permite usar a câmera. Abra o link no Chrome ou no Safari.', false); return;
    }
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 4096 }, height: { ideal: 4096 } }, audio: false });
      video.srcObject = stream;
      // Prévia espelhada na câmera frontal = movimento natural, como no Instagram
      video.classList.toggle('espelhar', facing === 'user');
      await video.play();
    } catch (e) {
      mostrarAviso('Não foi possível abrir a câmera. Permita o acesso à câmera nas configurações do navegador e tente de novo.', true);
    }
  }

  function numero(k) { return String(k).padStart(3, '0'); }

  function desenhar() {
    var vw = video.videoWidth, vh = video.videoHeight;
    // Recorte 9:16 na resolução real da câmera do celular (sem perder qualidade)
    var LARGURA, ALTURA;
    if (vw / vh > 9 / 16) { ALTURA = vh; LARGURA = Math.round(vh * 9 / 16); }
    else { LARGURA = vw; ALTURA = Math.round(vw * 16 / 9); }
    var c = document.createElement('canvas'); c.width = LARGURA; c.height = ALTURA;
    var ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    // "cover": preenche 9:16 cortando o excesso, sem espelhar
    var escala = Math.max(LARGURA / vw, ALTURA / vh);
    var w = vw * escala, h = vh * escala, x = (LARGURA - w) / 2, y = (ALTURA - h) / 2;
    ctx.drawImage(video, x, y, w, h);
    // moldura por cima, também em "cover"
    var mw = moldura.naturalWidth, mh = moldura.naturalHeight;
    if (mw && mh) {
      var e2 = Math.max(LARGURA / mw, ALTURA / mh);
      var w2 = mw * e2, h2 = mh * e2;
      ctx.drawImage(moldura, (LARGURA - w2) / 2, (ALTURA - h2) / 2, w2, h2);
    }
    return c;
  }

  function paraBlob(canvas) {
    return new Promise(function (ok) { canvas.toBlob(ok, 'image/jpeg', 0.95); });
  }

  async function salvar(blob, nome) {
    var file = new File([blob], nome, { type: 'image/jpeg' });
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    // iPhone não deixa salvar direto na galeria: abre a folha "Salvar imagem"
    if (ios && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  async function tirarFoto() {
    if (ocupado || !video.videoWidth) return;
    ocupado = true;
    try {
      var canvas = desenhar();
      flash.classList.remove('pisca'); void flash.offsetWidth; flash.classList.add('pisca');
      n += 1; gravarN(n);
      var nome = 'foto-' + numero(n) + '.jpg';
      var blob = await paraBlob(canvas);
      await salvar(blob, nome);
      fotos += 1; contadorEl.textContent = fotos; contadorEl.classList.add('ativo');
      mostrarToast('Foto ' + numero(n) + ' salva');
    } finally { ocupado = false; }
  }

  disparo.addEventListener('click', tirarFoto);
  tentar.addEventListener('click', iniciar);
  iniciar();
})();
</script>
</body>
</html>
